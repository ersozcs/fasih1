/* Layout: tek sütunlu uygulama; üstte ilerleme, altında üç sekme (Kartlar, Test, Liste). Arapça yazı sahnenin merkezinde. */
:root {
  --bg: #eaf0ef;
  --surface: #f9fbfa;
  --ink: #12292b;
  --muted: #5b7173;
  --line: #cfdcdb;
  --accent: #0b6e6e;
  --accent-ink: #ffffff;
  --gold: #a8700f;
  --good: #1d7a45;
  --bad: #b3372f;
  --good-bg: #dff1e6;
  --bad-bg: #f7dfdc;
  --hl-bg: #f6dfa8;
  --hl-ink: #3b2a05;
  --font-ar: "Hamdullah", "Amiri", "Noto Naskh Arabic", serif;
  --font-ui: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d1a1b; --surface: #15282a; --ink: #e4efee; --muted: #8fa9aa; --line: #284244;
    --accent: #4fc3bd; --accent-ink: #062423; --gold: #e0a840; --good: #5fcf8c; --bad: #ef8a80;
    --good-bg: #17382a; --bad-bg: #40201e; --hl-bg: #5a4513; --hl-ink: #ffe9b5; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d1a1b; --surface: #15282a; --ink: #e4efee; --muted: #8fa9aa; --line: #284244;
  --accent: #4fc3bd; --accent-ink: #062423; --gold: #e0a840; --good: #5fcf8c; --bad: #ef8a80;
  --good-bg: #17382a; --bad-bg: #40201e; --hl-bg: #5a4513; --hl-ink: #ffe9b5; color-scheme: dark;
}

/* Kullanıcı tarafından seçilebilen renk temaları */
:root[data-palette="charcoal"][data-theme="light"] {
  --bg:#e9e9ec; --surface:#f8f8fa; --ink:#202127; --muted:#686a73; --line:#d0d1d7;
  --accent:#454752; --accent-ink:#fff; --gold:#9a742e; --good:#26734b; --bad:#b33e43;
  --good-bg:#e0f0e7; --bad-bg:#f8e3e3; --hl-bg:#e9d9a8; --hl-ink:#30260e; color-scheme:light;
}
:root[data-palette="charcoal"][data-theme="dark"] {
  --bg:#101114; --surface:#1b1d22; --ink:#f0f0f3; --muted:#a0a2ad; --line:#34363e;
  --accent:#d6a63f; --accent-ink:#1f180a; --gold:#e3b64f; --good:#73d5a0; --bad:#ff9292;
  --good-bg:#1d382b; --bad-bg:#402327; --hl-bg:#574219; --hl-ink:#fbe9b8; color-scheme:dark;
}
:root[data-palette="charcoal"][data-theme="auto"] { --bg:#e9e9ec; --surface:#f8f8fa; --ink:#202127; --muted:#686a73; --line:#d0d1d7; --accent:#454752; --accent-ink:#fff; --gold:#9a742e; --good:#26734b; --bad:#b33e43; --good-bg:#e0f0e7; --bad-bg:#f8e3e3; --hl-bg:#e9d9a8; --hl-ink:#30260e; color-scheme:light; }
@media (prefers-color-scheme: dark) {
  :root[data-palette="charcoal"][data-theme="auto"] { --bg:#101114; --surface:#1b1d22; --ink:#f0f0f3; --muted:#a0a2ad; --line:#34363e; --accent:#d6a63f; --accent-ink:#1f180a; --gold:#e3b64f; --good:#73d5a0; --bad:#ff9292; --good-bg:#1d382b; --bad-bg:#402327; --hl-bg:#574219; --hl-ink:#fbe9b8; color-scheme:dark; }
}
/* Minimal: nötr, sade ve düşük kontrastlı arayüz */
:root[data-palette="minimal"][data-theme="light"], :root[data-palette="minimal"][data-theme="auto"] {
  --bg:#f4f5f6; --surface:#ffffff; --ink:#24272b; --muted:#737981; --line:#e1e4e8;
  --accent:#555d66; --accent-ink:#ffffff; --gold:#9a8458; --good:#347653; --bad:#b34b4b;
  --good-bg:#e8f1eb; --bad-bg:#f7eaea; --hl-bg:#eeeadf; --hl-ink:#39352c; color-scheme:light;
}
:root[data-palette="minimal"][data-theme="dark"] { --bg:#17191c; --surface:#202328; --ink:#eceef0; --muted:#a0a6ad; --line:#343940; --accent:#c0c5cb; --accent-ink:#202328; --gold:#c7b58d; --good:#79c69a; --bad:#f08b8b; --good-bg:#20382c; --bad-bg:#40282a; --hl-bg:#454033; --hl-ink:#f4efdf; color-scheme:dark; }
@media (prefers-color-scheme: dark) { :root[data-palette="minimal"][data-theme="auto"] { --bg:#17191c; --surface:#202328; --ink:#eceef0; --muted:#a0a6ad; --line:#343940; --accent:#c0c5cb; --accent-ink:#202328; --gold:#c7b58d; --good:#79c69a; --bad:#f08b8b; --good-bg:#20382c; --bad-bg:#40282a; --hl-bg:#454033; --hl-ink:#f4efdf; color-scheme:dark; } }
:root[data-palette="ocean"][data-theme="light"], :root[data-palette="ocean"][data-theme="auto"] { --learned:var(--accent); --bg:#e8eff7; --surface:#f8fbff; --ink:#182b43; --muted:#62778f; --line:#cbd8e7; --accent:#2866a0; --accent-ink:#fff; --gold:#a77824; --good:#28764d; --bad:#b33e43; --good-bg:#dff0e6; --bad-bg:#f8e2e2; --hl-bg:#f4dfa8; --hl-ink:#3b2d0b; color-scheme:light; }
:root[data-palette="ocean"][data-theme="dark"] { --learned:var(--accent); --bg:#101b2a; --surface:#19283b; --ink:#e6effb; --muted:#9bb0c8; --line:#30445d; --accent:#75b8f0; --accent-ink:#102033; --gold:#e9c16f; --good:#79d5a0; --bad:#ff9992; --good-bg:#1b3b31; --bad-bg:#47282b; --hl-bg:#5a451a; --hl-ink:#fff0c8; color-scheme:dark; }
@media (prefers-color-scheme: dark) { :root[data-palette="ocean"][data-theme="auto"] { --learned:var(--accent); --bg:#101b2a; --surface:#19283b; --ink:#e6effb; --muted:#9bb0c8; --line:#30445d; --accent:#75b8f0; --accent-ink:#102033; --gold:#e9c16f; --good:#79d5a0; --bad:#ff9992; --good-bg:#1b3b31; --bad-bg:#47282b; --hl-bg:#5a451a; --hl-ink:#fff0c8; color-scheme:dark; } }
.top-tools { display:flex; align-items:center; gap:10px; }
.theme-trigger { border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:10px; padding:7px 10px; display:flex; align-items:center; gap:7px; font-size:.86rem; font-weight:600; }
.theme-trigger .glyph { font-size:1.05rem; }
.theme-panel { background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:14px; display:grid; gap:12px; box-shadow:0 10px 30px #00000018; }
.theme-panel[hidden] { display:none; }
.theme-panel-title { font-size:.75rem; color:var(--muted); font-weight:700; letter-spacing:.06em; text-transform:uppercase; margin-bottom:6px; }
.theme-options { display:flex; flex-wrap:wrap; gap:7px; }
.theme-choice { border:1px solid var(--line); background:var(--bg); color:var(--ink); border-radius:9px; padding:8px 10px; font-size:.84rem; }
.theme-choice[aria-pressed="true"] { border-color:var(--accent); box-shadow:inset 0 0 0 1px var(--accent); background:var(--surface); }
@media (max-width:420px) { .theme-trigger .theme-label { display:none; } .top-tools { gap:7px; } }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.45;
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.app { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { margin: 0; font-size: 1.35rem; font-weight: 700; letter-spacing: -0.01em; }
.count { color: var(--muted); font-size: .9rem; font-variant-numeric: tabular-nums; }
.count b { color: var(--ink); }
.bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; display: flex; }
.bar i { display: block; height: 100%; transition: width .3s; }
.bar .l { background: var(--learned, var(--good)); }
.bar .p { background: var(--gold); }
.legend { display: flex; gap: 14px; font-size: .78rem; color: var(--muted); flex-wrap: wrap; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--learned, var(--good)); }
.legend span.p::before { background: var(--gold); }
.legend span.n::before { background: var(--line); }

nav { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; gap: 4px; }
nav button { border: 0; background: transparent; padding: 10px 6px; border-radius: 9px; font-weight: 600; color: var(--muted); }
nav button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.filter { display: flex; align-items: center; gap: 10px; font-size: .85rem; color: var(--muted); }
select { font: inherit; background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-height: 340px; width: 100%; padding: 22px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; }
.card .lesson { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.ar { font-family: var(--font-ar); direction: rtl; line-height: 1.8; font-weight: 400; font-kerning: normal; font-feature-settings: "kern" 1, "liga" 1, "calt" 1; }
.card .ar { font-size: clamp(3.4rem, 18vw, 5.2rem); }
.card .rd { font-size: 1.5rem; font-weight: 600; color: var(--accent); }
.card .tr { font-size: 1.25rem; }
.card .hint { color: var(--muted); font-size: .85rem; }
.flipbtn { all: unset; display: block; width: 100%; cursor: pointer; border-radius: 18px; }
.flipbtn:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.pager { display: flex; direction: ltr; overflow-x: hidden; touch-action: pan-y; border-radius: 18px; scroll-behavior: smooth; }
.pg { flex: 0 0 100%; min-width: 0; direction: ltr; }
.pg > * { height: 100%; }
.flipbtn .card { height: 100%; }
.vcard { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-height: 340px; padding: 22px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center; }
.vref { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.vcard .ar { font-size: clamp(1.7rem, 7.5vw, 2.3rem); line-height: 2; }
.vcard .ar mark { background: var(--hl-bg); color: var(--hl-ink); border-radius: 6px; padding: 0 .18em; }
.vcard .vtr { font-size: 1.02rem; line-height: 1.55; overflow-wrap: anywhere; }
.vcard .vword { font-size: .8rem; color: var(--muted); }
.vcard .vword .ar { font-size: 1.3rem; line-height: 1.2; color: var(--ink); }
.pdots { display: flex; justify-content: center; gap: 6px; }
.pdots button { border: 0; background: transparent; padding: 10px 0; flex: 1; max-width: 56px; border-radius: 6px; }
.pdots button i { display: block; height: 5px; border-radius: 3px; background: var(--line); transition: background .2s; }
.pdots button[aria-selected="true"] i { background: var(--accent); }
.pdots button:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 14px; border-radius: 12px; font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

.q { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.qmeta { display: flex; justify-content: space-between; color: var(--muted); font-size: .82rem; font-variant-numeric: tabular-nums; }
.prompt { text-align: center; padding: 8px 0; }
.prompt .ar { font-size: clamp(3rem, 16vw, 4.4rem); }
.prompt .t { font-size: 1.7rem; font-weight: 600; }
.prompt small { display: block; color: var(--muted); font-size: .8rem; margin-top: 4px; }
.opts { display: grid; gap: 10px; }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--bg); padding: 13px 14px; border-radius: 12px; font-weight: 500; overflow-wrap: anywhere; }
.opt.ar { text-align: center; font-size: 2rem; font-weight: 400; padding: 6px 14px; direction: rtl; }
.opt.good { border-color: var(--good); background: var(--good-bg); }
.opt.bad { border-color: var(--bad); background: var(--bad-bg); }
.fb { min-height: 1.4em; font-weight: 600; text-align: center; }
.fb.good { color: var(--good); } .fb.bad { color: var(--bad); }
.result { text-align: center; display: flex; flex-direction: column; gap: 12px; align-items: center; padding: 14px 0; }
.result .big { font-size: 3.2rem; font-weight: 700; font-variant-numeric: tabular-nums; }

su ben haksızlık edenlerdenim\" diye seslenmişti"}],[{"r":"20:14","s":"Tâhâ","a":"اِنَّن۪ٓي اَنَا اللّٰهُ لَٓا اِلٰهَ اِلَّٓا اَنَا۬ فَاعْبُدْن۪يۙ وَاَقِمِ الصَّلٰوةَ لِذِكْر۪ي","h":[1,6],"t":"Şüphesiz Ben Allah'ım, Benden başka tanrı yoktur; Bana kulluk et; Beni anmak için namaz kıl"},{"r":"22:49","s":"Hac","a":"قُلْ يَٓا اَيُّهَا النَّاسُ اِنَّمَٓا اَنَا۬ لَكُمْ نَذ۪يرٌ مُب۪ينٌۚ","h":[5],"t":"Ey insanlar! Ben sizin için ancak apaçık bir uyarıcıyım\" de"},{"r":"109:4","s":"Kâfirûn","a":"وَلَٓا اَنَا۬ عَابِدٌ مَا عَبَدْتُمْۙ","h":[1],"t":"Ben de sizin taptığınıza tapacak değilim"}],[{"r":"15:9","s":"Hicr","a":"اِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَاِنَّا لَهُ لَحَافِظُونَ","h":[1],"t":"Doğrusu Kitap'ı Biz indirdik, onun koruyucusu elbette Biziz"},{"r":"56:57","s":"Vâkıa","a":"نَحْنُ خَلَقْنَاكُمْ فَلَوْلَا تُصَدِّقُونَ۟","h":[0],"t":"Sizi yaratan Biziz; hala tasdik etmez misiniz"},{"r":"50:43","s":"Kâf","a":"اِنَّا نَحْنُ نُحْي۪ وَنُم۪يتُ وَاِلَيْنَا الْمَص۪يرُۙ","h":[1],"t":"Doğrusu Biz diriltiriz, Biz öldürürüz, dönüş Bize'dir"}],[{"r":"2:157","s":"Bakara","a":"اُو۬لٰٓئِكَ عَلَيْهِمْ صَلَوَاتٌ مِنْ رَبِّهِمْ وَرَحْمَةٌ وَاُو۬لٰٓئِكَ هُمُ الْمُهْتَدُونَ","h":[7],"t":"Rablerinin mağfiret ve rahmeti onlaradır. O'nun yolunda olanlar da onlardır"},{"r":"23:3","s":"Mü'minûn","a":"وَالَّذ۪ينَ هُمْ عَنِ اللَّغْوِ مُعْرِضُونَۙ","h":[1],"t":"Onlar boş şeylerden yüz çevirirler"},{"r":"9:10","s":"Tevbe","a":"لَا يَرْقُبُونَ ف۪ي مُؤْمِنٍ اِلًّا وَلَا ذِمَّةًۜ وَاُو۬لٰٓئِكَ هُمُ الْمُعْتَدُونَ","h":[8],"t":"Onlar hiçbir müminin yakınlık veya ahdini gözetmezler. İşte aşırı gidenler bunlardır"}],[{"r":"109:5","s":"Kâfirûn","a":"وَلَٓا اَنْتُمْ عَابِدُونَ مَٓا اَعْبُدُۜ","h":[1],"t":"Benim taptığıma da sizler tapmıyorsunuz"},{"r":"38:68","s":"Sâd","a":"اَنْتُمْ عَنْهُ مُعْرِضُونَ","h":[0],"t":"De ki: \"Bu Kuran büyük bir haberdir, ama siz ondan yüz çeviriyorsunuz"}],[{"r":"58:2","s":"Mücâdele","a":"اَلَّذ۪ينَ يُظَاهِرُونَ مِنْكُمْ مِنْ نِسَٓائِهِمْ مَا هُنَّ اُمَّهَاتِهِمْۜ اِنْ اُمَّهَاتُهُمْ اِلَّا الّٰٓـ۪ٔي وَلَدْنَهُمْۜ وَاِنَّهُمْ لَيَقُولُونَ مُنْكَرًا مِنَ الْقَوْلِ وَزُورًاۜ وَاِنَّ اللّٰهَ لَعَفُوٌّ غَفُورٌ","h":[6],"t":"İçinizde karılarını \"zıhar\" yapanlar bilsinler ki, karıları anneleri değildir; anneleri ancak, onları doğuranlardır. Doğrusu söyledikleri kötü ve asılsız bir sözdür. Allah şüphesiz affedendir, bağışlayandır"},{"r":"11:78","s":"Hûd","a":"وَجَٓاءَهُ قَوْمُهُ يُهْرَعُونَ اِلَيْهِ وَمِنْ قَبْلُ كَانُوا يَعْمَلُونَ السَّيِّـَٔاتِۜ قَالَ يَا قَوْمِ هٰٓؤُ۬لَٓاءِ بَنَات۪ي هُنَّ اَطْهَرُ لَكُمْ فَاتَّقُوا اللّٰهَ وَلَا تُخْزُونِ ف۪ي ضَيْف۪يۜ اَلَيْسَ مِنْكُمْ رَجُلٌ رَش۪يدٌ","h":[14],"t":"Milleti ona koşarak geldiler. Daha önce kötü işler işliyorlardı. \"Ey milletim! İşte bunlar benim kızlarım, onlar sizin için daha temizdir. (size nikahlıyabilirim!) Allah'tan sakının, konuklarımın önünde beni rezil etmeyin. İçinizde aklı başında kimse yok mudur?\" dedi"},{"r":"39:38","s":"Zümer","a":"وَلَئِنْ سَاَلْتَهُمْ مَنْ خَلَقَ السَّمٰوَاتِ وَالْاَرْضَ لَيَقُولُنَّ اللّٰهُۜ قُلْ اَفَرَاَيْتُمْ مَا تَدْعُونَ مِنْ دُونِ اللّٰهِ اِنْ اَرَادَنِيَ اللّٰهُ بِضُرٍّ هَلْ هُنَّ كَاشِفَاتُ ضُرِّه۪ٓ اَوْ اَرَادَن۪ي بِرَحْمَةٍ هَلْ هُنَّ مُمْسِكَاتُ رَحْمَتِه۪ۜ قُلْ حَسْبِيَ اللّٰهُۜ عَلَيْهِ يَتَوَكَّلُ الْمُتَوَكِّلُونَ","h":[20,27],"t":"And olsun ki, onlara, \"Gökleri ve yeri yaratan kimdir?\" diye sorsan: \"Allah'tır\" derler. De ki: \"Öyleyse bana bildirin, Allah bana bir zarar vermek isterse, Allah'ı bırakıp da taptıklarınız, O'nun verdiği zararı giderebilir mi? Yahut bana bir rahmetdilerse, O'nun rahmetini önleyebilir mi?\" De ki: \"Allah bana yeter; güvenenler O'na güvenir"}],[{"r":"28:35","s":"Kasas","a":"قَالَ سَنَشُدُّ عَضُدَكَ بِاَخ۪يكَ وَنَجْعَلُ لَكُمَا سُلْطَانًا فَلَا يَصِلُونَ اِلَيْكُمَا بِاٰيَاتِنَاۚ اَنْتُمَا وَمَنِ اتَّبَعَكُمَا الْغَالِبُونَ","h":[11],"t":"Allah: \"Seni kardeşinle destekleyeceğiz; ikinize bir kudret vereceğiz ki, onlar size el uzatamayacaklardır. Ayetlerimizle ikiniz ve ikinize uyanlar üstün geleceklerdir\" dedi"}],[{"r":"9:40","s":"Tevbe","a":"اِلَّا تَنْصُرُوهُ فَقَدْ نَصَرَهُ اللّٰهُ اِذْ اَخْرَجَهُ الَّذ۪ينَ كَفَرُوا ثَانِيَ اثْنَيْنِ اِذْ هُمَا فِي الْغَارِ اِذْ يَقُولُ لِصَاحِبِه۪ لَا تَحْزَنْ اِنَّ اللّٰهَ مَعَنَاۚ فَاَنْزَلَ اللّٰهُ سَك۪ينَتَهُ عَلَيْهِ وَاَيَّدَهُ بِجُنُودٍ لَمْ تَرَوْهَا وَجَعَلَ كَلِمَةَ الَّذ۪ينَ كَفَرُوا السُّفْلٰىۜ وَكَلِمَةُ اللّٰهِ هِيَ الْعُلْيَاۜ وَاللّٰهُ عَز۪يزٌ حَك۪يمٌ","h":[12],"t":"Ona (Muhammed'e) yardım etmezseniz, bilin ki, inkar edenler onu Mekke'den çıkardıklarında mağarada bulunan iki kişiden biri olarak Allah ona yardım etmişti. Arkadaşına (Ebu Bekir'e) \"Üzülme, Allah bizimledir\" diyordu; Allah da ona güven vermiş, görmediğiniz askerlerle onu desteklemiş, inkar edenlerin sözünü alçaltmıştı. Ancak Allah'ın sözü yücedir. Allah güçlüdür, hakimdir"}],[],[],[],[],[],[],[],[],[],[],[{"r":"6:18","s":"En'âm","a":"وَهُوَ الْقَاهِرُ فَوْقَ عِبَادِه۪ۜ وَهُوَ الْحَك۪يمُ الْخَب۪يرُ","h":[2],"t":"O, kullarının üstünde yegane tasarruf sahibidir. Hakim'dir, haberdardır"},{"r":"14:26","s":"İbrâhîm","a":"وَمَثَلُ كَلِمَةٍ خَب۪يثَةٍ كَشَجَرَةٍ خَب۪يثَةٍۨ اجْتُثَّتْ مِنْ فَوْقِ الْاَرْضِ مَا لَهَا مِنْ قَرَارٍ","h":[7],"t":"Çirkin bir söz de, yerden koparılmış, kökü olmayan kötü bir ağaca benzer"},{"r":"16:88","s":"Nahl","a":"اَلَّذ۪ينَ كَفَرُوا وَصَدُّوا عَنْ سَب۪يلِ اللّٰهِ زِدْنَاهُمْ عَذَابًا فَوْقَ الْعَذَابِ بِمَا كَانُوا يُفْسِدُونَ","h":[8],"t":"İnkar eden, Allah'ın yolundan alıkoyanlara, bozgunculuklarına karşılık azap üstüne azap veririz"}],[{"r":"20:6","s":"Tâhâ","a":"لَهُ مَا فِي السَّمٰوَاتِ وَمَا فِي الْاَرْضِ وَمَا بَيْنَهُمَا وَمَا تَحْتَ الثَّرٰى","h":[10],"t":"Göklerde ve yerde, her ikisi arasında ve toprağın altında bulunanlar O'nundur"},{"r":"41:29","s":"Fussilet","a":"وَقَالَ الَّذ۪ينَ كَفَرُوا رَبَّنَٓا اَرِنَا الَّذَيْنِ اَضَلَّانَا مِنَ الْجِنِّ وَالْاِنْسِ نَجْعَلْهُمَا تَحْتَ اَقْدَامِنَا لِيَكُونَا مِنَ الْاَسْفَل۪ينَ","h":[11],"t":"İnkar edenler: \"Rabbimiz! Cinlerden ve insanlardan, bizi saptıranları göster, onları ayaklarımızın altına alalım da en altta kalanlardan olsunlar\" derler"}],[{"r":"75:5","s":"Kıyâmet","a":"بَلْ يُر۪يدُ الْاِنْسَانُ لِيَفْجُرَ اَمَامَهُۚ","h":[4],"t":"Ama, insanoğlu gelecekte de suç işlemek ister de: \"Kıyamet günü ne zamanmış! \" der"}],[{"r":"36:9","s":"Yâsîn","a":"وَجَعَلْنَا مِنْ بَيْنِ اَيْد۪يهِمْ سَدًّا وَمِنْ خَلْفِهِمْ سَدًّا فَاَغْشَيْنَاهُمْ فَهُمْ لَا يُبْصِرُونَ","h":[6],"t":"Önlerine ve arkalarına sed çekmişizdir. Gözlerini perdelediğimizden artık göremezler"},{"r":"4:9","s":"Nisâ","a":"وَلْيَخْشَ الَّذ۪ينَ لَوْ تَرَكُوا مِنْ خَلْفِهِمْ ذُرِّيَّةً ضِعَافًا خَافُوا عَلَيْهِمْۖ فَلْيَتَّقُوا اللّٰهَ وَلْيَقُولُوا قَوْلًا سَد۪يدًا","h":[5],"t":"Arkalarında cılız çocuklar bıraktıkları takdirde, bundan endişe edecek olanlar, haksızlık yapmaktan korksunlar; dürüst söz söylesinler"},{"r":"7:17","s":"A'râf","a":"ثُمَّ لَاٰتِيَنَّهُمْ مِنْ بَيْنِ اَيْد۪يهِمْ وَمِنْ خَلْفِهِمْ وَعَنْ اَيْمَانِهِمْ وَعَنْ شَمَٓائِلِهِمْۜ وَلَا تَجِدُ اَكْثَرَهُمْ شَاكِر۪ينَ","h":[6],"t":"Beni azdırdığın için, and olsun ki, Senin doğru yolun üzerinde onlara karşı duracağım; sonra önlerinden, ardlarından, sağ ve sollarından onlara sokulacağım; çoğunu Sana şükreder bulamayacaksın\" dedi"}],[{"r":"23:7","s":"Mü'minûn","a":"فَمَنِ ابْتَغٰى وَرَٓاءَ ذٰلِكَ فَاُو۬لٰٓئِكَ هُمُ الْعَادُونَۚ","h":[2],"t":"Bu sınırları aşmak isteyenler, işte bunlar aşırı gidenlerdir"},{"r":"49:4","s":"Hucurât","a":"اِنَّ الَّذ۪ينَ يُنَادُونَكَ مِنْ وَرَٓاءِ الْحُجُرَاتِ اَكْثَرُهُمْ لَا يَعْقِلُونَ","h":[4],"t":"Sana odaların ötesinden seslenenlerin çoğu akletmeyen kimselerdir"},{"r":"84:10","s":"İnşikâk","a":"وَاَمَّا مَنْ اُو۫تِيَ كِتَابَهُ وَرَٓاءَ ظَهْرِه۪ۙ","h":[4],"t":"Ama amel defteri kendisine arkasından verilen kimse: \"Mahvoldum\" diye bağırır ve çılgın alevli cehenneme girer"}],[{"r":"20:110","s":"Tâhâ","a":"يَعْلَمُ مَا بَيْنَ اَيْد۪يهِمْ وَمَا خَلْفَهُمْ وَلَا يُح۪يطُونَ بِه۪ عِلْمًا","h":[2],"t":"Allah onların geçmişlerini de, geleceklerini de bilir. Onların hiçbirinin ilmi ise O'nu kuşatamaz"},{"r":"22:76","s":"Hac","a":"يَعْلَمُ مَا بَيْنَ اَيْد۪يهِمْ وَمَا خَلْفَهُمْۜ وَاِلَى اللّٰهِ تُرْجَعُ الْاُمُورُ","h":[2],"t":"O, geçmişlerini geleceklerini bilir. Bütün işler Allah'a döner"},{"r":"25:38","s":"Furkân","a":"وَعَادًا وَثَمُودَا۬ وَاَصْحَابَ الرَّسِّ وَقُرُونًا بَيْنَ ذٰلِكَ كَث۪يرًا","h":[5],"t":"Ad, Semud milletleri ile Ress'lileri ve bunların arasında birçok nesilleri de yerle bir ettik"}],[{"r":"19:68","s":"Meryem","a":"فَوَرَبِّكَ لَنَحْشُرَنَّهُمْ وَالشَّيَاط۪ينَ ثُمَّ لَنُحْضِرَنَّهُمْ حَوْلَ جَهَنَّمَ جِثِيًّاۚ","h":[5],"t":"Rabbine and olsun ki Biz onları mutlaka uydukları şeytanlarla beraber haşredeceğiz. Sonra cehennemin yanında diz çöktürerek hazır bulunduracağız"}],[{"r":"7:182","s":"A'râf","a":"وَالَّذ۪ينَ كَذَّبُوا بِاٰيَاتِنَا سَنَسْتَدْرِجُهُمْ مِنْ حَيْثُ لَا يَعْلَمُونَۚ","h":[5],"t":"Ayetlerimizi yalan sayanları, bilmedikleri yönden, ağır ağır sonuçlarına yaklaştıracağız"},{"r":"39:25","s":"Zümer","a":"كَذَّبَ الَّذ۪ينَ مِنْ قَبْلِهِمْ فَاَتٰيهُمُ الْعَذَابُ مِنْ حَيْثُ لَا يَشْعُرُونَ","h":[7],"t":"Onlardan öncekiler de peygamberleri yalanlamışlardı da farkına varmadıkları yerden onlara bir azap çatmıştı"},{"r":"68:44","s":"Kalem","a":"فَذَرْن۪ي وَمَنْ يُكَذِّبُ بِهٰذَا الْحَد۪يثِۜ سَنَسْتَدْرِجُهُمْ مِنْ حَيْثُ لَا يَعْلَمُونَۙ","h":[7],"t":"Kuran'ı yalanlayanları Bana bırak; Biz onları bilmedikleri yerden yavaş yavaş azaba yaklaştıracağız"}],[{"r":"56:90","s":"Vâkıa","a":"وَاَمَّٓا اِنْ كَانَ مِنْ اَصْحَابِ الْيَم۪ينِۙ","h":[5],"t":"Eğer defteri sağdan verilenlerden ise"},{"r":"56:91","s":"Vâkıa","a":"فَسَلَامٌ لَكَ مِنْ اَصْحَابِ الْيَم۪ينِ","h":[4],"t":"Ey sağcılardan olan kişi, sana selam olsun!\" denir"},{"r":"74:39","s":"Müddessir","a":"اِلَّٓا اَصْحَابَ الْيَم۪ينِۜۛ","h":[2],"t":"Ancak, defteri sağdan verilenler böyle değildir; onlar cennettedirler. Suçlulara: \"Sizi bu yakıcı ateşe sürükleyen nedir?\" diye sorarlar"}],[{"r":"56:41","s":"Vâkıa","a":"وَاَصْحَابُ الشِّمَالِۙ مَٓا اَصْحَابُ الشِّمَالِۜ","h":[1,4],"t":"Defterleri soldan verilenler; ne yazık o solculara"},{"r":"70:37","s":"Meâric","a":"عَنِ الْيَم۪ينِۙ وَعَنِ الشِّمَالِ عِز۪ينَ","h":[3],"t":"İnkar edenlere ne oluyor, sana doğru sağdan soldan topluluklar halinde koşuşuyorlar"},{"r":"50:17","s":"Kâf","a":"اِذْ يَتَلَقَّى الْمُتَلَقِّيَانِ عَنِ الْيَم۪ينِ وَعَنِ الشِّمَالِ قَع۪يدٌ","h":[6],"t":"Sağında ve solunda, onunla beraber oturan iki alıcı melek, yanında hazır birer gözcü olarak söylediği her sözü zaptederler"}],[{"r":"21:59","s":"Enbiyâ","a":"قَالُوا مَنْ فَعَلَ هٰذَا بِاٰلِهَتِنَٓا اِنَّهُ لَمِنَ الظَّالِم۪ينَ","h":[1],"t":"Milleti: \"Tanrılarımıza bunu kim yaptı? Doğrusu o zalimlerden biridir\" dediler"},{"r":"79:40","s":"Naziât","a":"وَاَمَّا مَنْ خَافَ مَقَامَ رَبِّه۪ وَنَهَى النَّفْسَ عَنِ الْهَوٰىۙ","h":[1],"t":"Ama kim Rabbinin azametinden korkup da kendini kötülükten alıkoymuşsa, varacağı yer şüphesiz cennettir"},{"r":"88:23","s":"Gâşiye","a":"اِلَّا مَنْ تَوَلّٰى وَكَفَرَۙ","h":[1],"t":"Ama kim yüz çevirir, inkar ederse, Allah onu en büyük azaba uğratır"}],[{"r":"67:25","s":"Mülk","a":"وَيَقُولُونَ مَتٰى هٰذَا الْوَعْدُ اِنْ كُنْتُمْ صَادِق۪ينَ","h":[1],"t":"Doğru sözlü iseniz bildirin bu azap sözü ne zamandır?\" derler"},{"r":"10:48","s":"Yûnus","a":"وَيَقُولُونَ مَتٰى هٰذَا الْوَعْدُ اِنْ كُنْتُمْ صَادِق۪ينَ","h":[1],"t":"Bu iddiada samimi iseniz, bu azabın gerçekleşmesi ne zamandır? söyle\" derler"},{"r":"21:38","s":"Enbiyâ","a":"وَيَقُولُونَ مَتٰى هٰذَا الْوَعْدُ اِنْ كُنْتُمْ صَادِق۪ينَ","h":[1],"t":"Doğru sözlü iseniz bildirin bu tehdit ne zamandır?\" derler"}],[{"r":"28:62","s":"Kasas","a":"وَيَوْمَ يُنَاد۪يهِمْ فَيَقُولُ اَيْنَ شُرَكَٓاءِيَ الَّذ۪ينَ كُنْتُمْ تَزْعُمُونَ","h":[3],"t":"Allah, o gün onlara seslenir: \"Benim ortağım olduklarını iddia ettikleriniz nerededirler?\" der"},{"r":"28:74","s":"Kasas","a":"وَيَوْمَ يُنَاد۪يهِمْ فَيَقُولُ اَيْنَ شُرَكَٓاءِيَ الَّذ۪ينَ كُنْتُمْ تَزْعُمُونَ","h":[3],"t":"O gün Allah onlara seslenir: \"Benim ortağım olduklarını iddia ettiklerin adar oldunuz"},{"r":"43:29","s":"Zuhruf","a":"بَلْ مَتَّعْتُ هٰٓؤُ۬لَٓاءِ وَاٰبَٓاءَهُمْ حَتّٰى جَٓاءَهُمُ الْحَقُّ وَرَسُولٌ مُب۪ينٌ","h":[4],"t":"Hayır; Ben bunları ve babalarını gerçek ve onu açıklayan bir peygamber gelene kadar geçindirdim"}],[{"r":"21:69","s":"Enbiyâ","a":"قُلْنَا يَا نَارُ كُون۪ي بَرْدًا وَسَلَامًا عَلٰٓى اِبْرٰه۪يمَۙ","h":[6],"t":"Biz: \"Ey ateş! İbrahim'e karşı serin ve zararsız ol\" dedik"},{"r":"16:99","s":"Nahl","a":"اِنَّهُ لَيْسَ لَهُ سُلْطَانٌ عَلَى الَّذ۪ينَ اٰمَنُوا وَعَلٰى رَبِّهِمْ يَتَوَكَّلُونَ","h":[4],"t":"Doğrusu şeytanın, inananlar ve yalnız Rablerine güvenenler üzerinde bir nüfuzu yoktur"},{"r":"25:16","s":"Furkân","a":"لَهُمْ ف۪يهَا مَا يَشَٓاؤُ۫نَ خَالِد۪ينَۜ كَانَ عَلٰى رَبِّكَ وَعْدًا مَسْؤُ۫لًا","h":[6],"t":"Temelli kalacakları cennette diledikleri şeyleri bulurlar. Bu, Rabbinin yerine getirilmesi istenen bir vaadidir"}],[{"r":"9:119","s":"Tevbe","a":"يَٓا اَيُّهَا الَّذ۪ينَ اٰمَنُوا اتَّقُوا اللّٰهَ وَكُونُوا مَعَ الصَّادِق۪ينَ","h":[7],"t":"Ey inananlar! Allah'tan sakının ve doğrularla beraber olun"},{"r":"15:32","s":"Hicr","a":"قَالَ يَٓا اِبْل۪يسُ مَا لَكَ اَلَّا تَكُونَ مَعَ السَّاجِد۪ينَ","h":[7],"t":"Allah: \"Ey İblis! Secde edenlerle beraber olmaktan seni alıkoyan nedir?\" dedi"},{"r":"26:213","s":"Şuarâ","a":"فَلَا تَدْعُ مَعَ اللّٰهِ اِلٰهًا اٰخَرَ فَتَكُونَ مِنَ الْمُعَذَّب۪ينَۚ","h":[2],"t":"O halde sakın Allah'ın yanında başka tanrı tutup ona yalvarma, yoksa azap göreceklerden olursun"}]];

  var KEY = "kelime-atolyesi-v1";
  var LEARNED = 3;
  var state = { score: {} };
  try { var s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s && s.score) state = { score: s.score }; } catch (e) {}
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function sc(id) { return state.score[id] || 0; }
  function bump(id, d) { state.score[id] = Math.max(0, Math.min(LEARNED, sc(id) + d)); save(); }

  var tab = "cards", lesson = "all";
  var card = { id: null, flipped: false };
  var quiz = null;
  var $ = function (id) { return document.getElementById(id); };

  var themePrefs = { mode: "auto", palette: "charcoal" };
  try {
    var savedThemePrefs = JSON.parse(localStorage.getItem("kelime-atolyesi-theme") || "null");
    if (savedThemePrefs && ["auto", "light", "dark"].indexOf(savedThemePrefs.mode) >= 0) themePrefs.mode = savedThemePrefs.mode;
    if (savedThemePrefs && ["green", "charcoal", "sepia", "minimal", "ocean"].indexOf(savedThemePrefs.palette) >= 0) {
      themePrefs.palette = savedThemePrefs.palette === "sepia" ? "minimal" : savedThemePrefs.palette;
    }
  } catch (e) {}
  function applyThemePrefs() {
    document.documentElement.setAttribute("data-theme", themePrefs.mode);
    document.documentElement.setAttribute("data-palette", themePrefs.palette);
    ["auto", "light", "dark"].forEach(function (mode) {
      var b = document.querySelector('[data-mode="' + mode + '"]');
      if (b) b.setAttribute("aria-pressed", themePrefs.mode === mode ? "true" : "false");
    });
    ["charcoal", "minimal", "green", "ocean"].forEach(function (palette) {
      var b = document.querySelector('[data-palette="' + palette + '"]');
      if (b) b.setAttribute("aria-pressed", themePrefs.palette === palette ? "true" : "false");
    });
    try { localStorage.setItem("kelime-atolyesi-theme", JSON.stringify(themePrefs)); } catch (e) {}
  }
  var themeTrigger = $("themeTrigger"), themePanel = $("themePanel");
  applyThemePrefs();
  themeTrigger.onclick = function () {
    var opening = themePanel.hidden;
    themePanel.hidden = !opening;
    themeTrigger.setAttribute("aria-expanded", opening ? "true" : "false");
  };
  $("modeOptions").onclick = function (e) {
    var b = e.target.closest("button[data-mode]"); if (!b) return;
    themePrefs.mode = b.getAttribute("data-mode"); applyThemePrefs();
  };
  $("paletteOptions").onclick = function (e) {
    var b = e.target.closest("button[data-palette]"); if (!b) return;
    themePrefs.palette = b.getAttribute("data-palette"); applyThemePrefs();
  };
  document.addEventListener("click", function (e) {
    if (!themePanel.hidden && !themePanel.contains(e.target) && !themeTrigger.contains(e.target)) {
      themePanel.hidden = true; themeTrigger.setAttribute("aria-expanded", "false");
    }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !themePanel.hidden) { themePanel.hidden = true; themeTrigger.setAttribute("aria-expanded", "false"); themeTrigger.focus(); }
  });
  var view = $("view");

  function pool() { return WORDS.filter(function (w) { return lesson === "all" || String(w.lesson) === lesson || w.sub === lesson; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

  function buildSelect() {
    var n = function (f) { return WORDS.filter(f).length; };
    var h = '<option value="all">Tüm kelimeler (' + WORDS.length + ')</option>';
    LESSONS.forEach(function (l) {
      h += '<option value="' + l.id + '">Ders ' + l.id + ' · ' + esc(l.title) + ' (' + n(function (w) { return String(w.lesson) === l.id; }) + ')</option>';
      l.subs.forEach(function (x) {
        h += '<option value="' + x.id + '">\u00a0\u00a0\u00a0\u00a0Ders ' + x.id + ' · ' + esc(x.title) + ' (' + n(function (w) { return w.sub === x.id; }) + ')</option>';
      });
    });
    $("lessonSel").innerHTML = h;
    $("lessonSel").value = lesson;
  }

  function progress() {
    var l = 0, p = 0, ws = pool(), n = ws.length || 1;
    ws.forEach(function (w) { var s = sc(w.id); if (s >= LEARNED) l++; else if (s > 0) p++; });
    $("count").innerHTML = "<b>" + l + "</b> / " + ws.length + " öğrenildi";
    $("barL").style.width = (l / n * 100) + "%";
    $("barP").style.width = (p / n * 100) + "%";
    $("bar").setAttribute("aria-valuenow", l); $("bar").setAttribute("aria-valuemax", ws.length);
  }

  function nextCard() {
    var ws = pool().filter(function (w) { return w.id !== card.id; });
    if (!ws.length) ws = pool();
    var tot = 0, wts = ws.map(function (w) { var x = Math.pow(LEARNED + 1 - sc(w.id), 2); tot += x; return x; });
    var r = Math.random() * tot, i = 0;
    while (i < ws.length - 1 && r >= wts[i]) { r -= wts[i]; i++; }
    card.id = ws[i].id; card.flipped = false;
  }

  function verseHTML(w, v) {
    var hl = {}; v.h.forEach(function (k) { hl[k] = 1; });
    var ar = v.a.split(" ").map(function (t, k) { return hl[k] ? "<mark>" + esc(t) + "</mark>" : esc(t); }).join(" ");
    return '<div class="vcard"><div class="vref">' + esc(v.s) + ' Suresi · ' + v.r + '</div>' +
      '<div class="ar" lang="ar">' + ar + '</div><div class="vtr">' + esc(v.t) + '</div>' +
      '<div class="vword">Vurgulanan kelime: <span class="ar" lang="ar">' + w.ar + '</span> · ' + esc(w.rd) + '</div></div>';
  }
  var reduceMotion = false;
  try { reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch (e) {}

  function renderCards() {
    if (card.id === null || !pool().some(function (w) { return w.id === card.id; })) nextCard();
    var w = WORDS[card.id], s = sc(w.id);
    var vs = card.flipped ? (VERSES[w.id] || []) : [];
    var back = card.flipped
      ? '<div class="rd">' + esc(w.rd) + '</div><div class="tr">' + esc(w.tr) + '</div><div class="hint">' + (vs.length ? 'Ayetler için sola kaydır ←' : 'Bitişik yazıldığı için ayet örneği yok') + '</div>'
      : '<div class="hint">Anlamını görmek için karta dokun</div>';
    var pages = ['<div class="pg"><button class="flipbtn" id="flip" aria-label="Kartı çevir"><div class="card">' +
      '<div class="lesson">Ders ' + w.sub + ' · Seviye ' + s + '/' + LEARNED + '</div>' +
      '<div class="ar" lang="ar">' + w.ar + '</div>' + back + '</div></button></div>']
      .concat(vs.map(function (v) { return '<div class="pg">' + verseHTML(w, v) + '</div>'; }));
    var tabs = pages.map(function (_, i) {
      return '<button role="tab" data-p="' + i + '" aria-selected="' + (i === 0) + '" aria-label="' + (i === 0 ? "Kelime" : "Ayet " + i) + '"><i></i></button>';
    }).join("");
    view.innerHTML =
      '<div style="display:flex;flex-direction:column;gap:10px">' +
      '<div class="pager" id="pager">' + pages.join("") + '</div>' +
      '<div class="pdots" id="pdots" role="tablist" aria-label="Kelime ve ayetler"' + (pages.length > 1 ? '' : ' style="visibility:hidden"') + '>' + tabs + '</div>' +
      '<div class="actions" style="margin-top:4px"><button class="btn" id="again" ' + (card.flipped ? "" : "disabled") + '>Tekrar göster</button>' +
      '<button class="btn primary" id="know" ' + (card.flipped ? "" : "disabled") + '>Bildim</button></div></div>';
    var pager = $("pager"), cur = 0, btns = $("pdots").children;
    function mark(i) { cur = i; Array.prototype.forEach.call(btns, function (b, k) { b.setAttribute("aria-selected", k === i ? "true" : "false"); }); }
    function go(i) {
      i = Math.max(0, Math.min(pages.length - 1, i));
      pager.scrollTo({ left: i * pager.clientWidth, behavior: reduceMotion ? "auto" : "smooth" });
      mark(i);
    }
    
    var swipeStart = null;
    pager.addEventListener("pointerdown", function (e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      swipeStart = { x: e.clientX, y: e.clientY, id: e.pointerId };
    });
    pager.addEventListener("pointerup", function (e) {
      if (!swipeStart || swipeStart.id !== e.pointerId) return;
      var dx = e.clientX - swipeStart.x;
      var dy = e.clientY - swipeStart.y;
      swipeStart = null;
      if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy) * 1.2) return;
      // Düzeltilen kısım: Sola kaydırma (dx < 0) bir sonraki sayfayı/ayeti açar
      if (dx < 0) go(cur + 1); else go(cur - 1);
    });
    pager.addEventListener("pointercancel", function () { swipeStart = null; });
    $("pdots").onclick = function (e) { var b = e.target.closest("button[data-p]"); if (b) go(+b.getAttribute("data-p")); };
    card.nav = function (d) { go(cur + d); };
    $("flip").onclick = function () { card.flipped = !card.flipped; renderCards(); };
    $("again").onclick = function () { bump(w.id, -1); progress(); nextCard(); renderCards(); };
    $("know").onclick = function () { bump(w.id, 1); progress(); nextCard(); renderCards(); };
  }

  function startQuiz() {
    var ws = shuffle(pool()).slice(0, 10);
    quiz = { qs: ws.map(function (w, i) { return { w: w, dir: i % 2 === 0 ? "ar2tr" : "tr2ar" }; }), i: 0, right: 0, picked: null };
    quiz.qs = shuffle(quiz.qs);
  }
  function meanings(t) { return t.replace(/\([^)]*\)/g, "").split(/[,;]/).map(function (x) { return x.trim().toLowerCase(); }).filter(Boolean); }
  function clashes(a, b) { var m = meanings(b.tr); return meanings(a.tr).some(function (x) { return m.indexOf(x) >= 0; }); }
  function options(w) {
    var rest = WORDS.filter(function (x) { return x.id !== w.id && x.ar !== w.ar && !clashes(w, x); });
    var same = shuffle(rest.filter(function (x) { return x.lesson === w.lesson; }));
    var other = shuffle(rest.filter(function (x) { return x.lesson !== w.lesson; }));
    return shuffle([w].concat(same.concat(other).slice(0, 3)));
  }
  function renderQuiz() {
    if (!quiz) startQuiz();
    if (quiz.i >= quiz.qs.length) {
      view.innerHTML = '<div class="q"><div class="result"><div>Sonuç</div><div class="big">' + quiz.right + ' / ' + quiz.qs.length + '</div>' +
        '<div>' + (quiz.right === quiz.qs.length ? "Hepsi doğru." : "Yanlış yaptıkların kartlarda daha sık çıkacak.") + '</div>' +
        '<button class="btn primary" id="again2" style="width:100%">Yeni test</button></div></div>';
      $("again2").onclick = function () { quiz = null; renderQuiz(); };
      return;
    }
    var q = quiz.qs[quiz.i], w = q.w;
    if (!q.opts) q.opts = options(w);
    var ar = q.dir === "tr2ar";
    var prompt = ar
      ? '<div class="t">' + esc(w.tr) + '</div><small>Arapçası hangisi?</small>'
      : '<div class="ar" lang="ar">' + w.ar + '</div><small>Anlamı hangisi?</small>';
    var opts = q.opts.map(function (o, k) {
      var cls = "opt" + (ar ? " ar" : ""), picked = quiz.picked !== null;
      if (picked && o.id === w.id) cls += " good";
      else if (picked && quiz.picked === o.id) cls += " bad";
      return '<button class="' + cls + '" data-id="' + o.id + '" ' + (picked ? "disabled" : "") + (ar ? ' lang="ar"' : "") + '>' + (ar ? o.ar : esc(o.tr)) + '</button>';
    }).join("");
    var fb = "";
    if (quiz.picked !== null) {
      var ok = quiz.picked === w.id;
      fb = '<div class="fb ' + (ok ? "good" : "bad") + '">' + (ok ? "Doğru" : "Yanlış") + ' · ' + w.ar + ' (' + esc(w.rd) + ') = ' + esc(w.tr) + '</div>' +
        '<button class="btn primary" id="nxt">' + (quiz.i + 1 === quiz.qs.length ? "Sonucu gör" : "Sonraki") + '</button>';
    }
    view.innerHTML = '<div class="q"><div class="qmeta"><span>Soru ' + (quiz.i + 1) + ' / ' + quiz.qs.length + '</span><span>Doğru: ' + quiz.right + '</span></div>' +
      '<div class="prompt">' + prompt + '</div><div class="opts">' + opts + '</div>' + fb + '</div>';
    Array.prototype.forEach.call(view.querySelectorAll(".opt"), function (b) {
      b.onclick = function () {
        var id = +b.getAttribute("data-id"); quiz.picked = id;
        if (id === w.id) { quiz.right++; bump(w.id, 1); } else bump(w.id, -1);
        progress(); renderQuiz();
      };
    });
    if ($("nxt")) $("nxt").onclick = function () { quiz.i++; quiz.picked = null; renderQuiz(); };
  }

  function renderList() {
    var html = "", last = null;
    pool().forEach(function (w) {
      if (w.sub !== last) { html += '<div class="group">Ders ' + w.sub + ' · ' + esc(SUBS[w.sub].title) + '</div>'; last = w.sub; }
      var s = sc(w.id), st = s >= LEARNED ? ["l", "Öğrenildi"] : s > 0 ? ["p", "Öğreniyorum"] : ["", "Yeni"];
      html += '<div class="row"><div class="ar" lang="ar">' + w.ar + '</div><div class="m"><b>' + esc(w.rd) + '</b><span>' + esc(w.tr) + '</span></div><span class="pill ' + st[0] + '">' + st[1] + '</span></div>';
    });
    view.innerHTML = '<div class="list">' + html + '</div>';
  }

  function render() {
    ["cards", "quiz", "list"].forEach(function (t) { $("tab-" + t).setAttribute("aria-selected", t === tab ? "true" : "false"); });
    if (tab === "cards") renderCards(); else if (tab === "quiz") renderQuiz(); else renderList();
  }

  $("tabs").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-tab]"); if (!b) return;
    tab = b.getAttribute("data-tab"); render();
  });
  $("lessonSel").onchange = function () { lesson = this.value; card.id = null; quiz = null; progress(); render(); };
  document.addEventListener("keydown", function (e) {
    if (tab !== "cards" || e.target.tagName === "SELECT") return;
    if (e.key === " " && e.target.tagName !== "BUTTON") { e.preventDefault(); card.flipped = !card.flipped; renderCards(); }
    else if (e.key === "ArrowRight" && card.nav) { e.preventDefault(); card.nav(1); }
    else if (e.key === "ArrowLeft" && card.nav) { e.preventDefault(); card.nav(-1); }
  });

  function bindReset() {
    $("resetWrap").innerHTML = '<button class="link warn" id="resetBtn">İlerlemeyi sıfırla</button>';
    $("resetBtn").onclick = function () {
      $("resetWrap").innerHTML = 'Emin misin? <button class="link warn" id="yes">Sıfırla</button> · <button class="link" id="no">Vazgeç</button>';
      $("yes").onclick = function () { state = { score: {} }; save(); card.id = null; quiz = null; bindReset(); progress(); render(); };
      $("no").onclick = bindReset;
    };
  }
  buildSelect(); bindReset(); progress(); render();
})();
</script>
</body>
</html>
